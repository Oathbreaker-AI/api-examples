name: Check examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
  frameworks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [openai-sdk, langchain, llamaindex, crewai]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: python3 -m venv .venv && .venv/bin/pip install -r ${{ matrix.framework }}/requirements.txt
      - if: matrix.framework == 'openai-sdk'
        run: npm ci --prefix openai-sdk
      - run: node --test tests/frameworks/${{ matrix.framework }}.test.mjs
        env:
          PYTHON: .venv/bin/python
